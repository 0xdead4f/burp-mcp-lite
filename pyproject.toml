[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burp-mcp-lite"
version = "0.1.0"
description = "Token-efficient middleware MCP server for Burp Suite proxy history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "0xdead4f" }]
keywords = ["burp", "burpsuite", "mcp", "model-context-protocol", "security", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "anyio>=4.5",
]

[project.urls]
Homepage = "https://github.com/0xdead4f/burp-mcp-lite"
Repository = "https://github.com/0xdead4f/burp-mcp-lite"
Issues = "https://github.com/0xdead4f/burp-mcp-lite/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
burp-mcp-lite = "burp_mcp_lite.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/burp_mcp_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
